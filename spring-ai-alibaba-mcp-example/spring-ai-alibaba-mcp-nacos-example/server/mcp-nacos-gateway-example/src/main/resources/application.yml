spring:
  application:
    name: spring-ai-alibaba-mcp-gateway-example
  ai:
    mcp:
      server:
        name: mcp-gateway-example
        version: 1.0.0

    alibaba:
      mcp:
        nacos:
          server-addr: localhost:8848
          namespace: eb466cbc-091a-4386-8b8d-6d1ce7b9d7c6
          username: nacos
          password: nacos
        gateway:
          enabled: true
          registry: nacos
          nacos:
            service-names: webflux-mcp-server

server:
  port: 8092
